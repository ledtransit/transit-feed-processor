[package]
name = "transit-feed-processor"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Mirrors GTFS static feeds into PostgreSQL and overlays GTFS-Realtime trip updates"
repository = "https://github.com/LEDTransit/transit-feed-processor"
readme = "README.md"
keywords = ["gtfs", "gtfs-realtime", "transit", "postgres"]
categories = ["command-line-utilities"]
publish = false

[features]
default = []
plugin = ["dep:serde_json"]

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
chrono-tz = "0.10.4"
csv = "1.4.0"
dotenvy = "0.15.7"
env_logger = "0.11.12"
gtfs-structures = "0.50.1"
log = "0.4.35"
prost = "0.14.6"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
sha2 = "0.11.1"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-none", "postgres", "migrate", "chrono"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
zip = "8.6.0"

[build-dependencies]
prost-build = "0.14.6"

[profile.release]
opt-level = 3
